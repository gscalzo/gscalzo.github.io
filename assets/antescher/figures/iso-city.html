<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antescher — the city, rotated</title>
<link rel="stylesheet" href="embed.css">
</head>
<body class="flush">
<div class="viewer">
  <div class="viewer-stage">
    <canvas id="iso" role="img" aria-label="Isometric render of the city of Antescher, drawn from the original 16KB map data"></canvas>
  </div>
  <div class="viewer-bar">
    <div class="ctl"><span>VIEW</span>
      <div class="seg" id="views" role="group" aria-label="City view direction">
        <button aria-pressed="true" data-v="0">N</button>
        <button aria-pressed="false" data-v="1">E</button>
        <button aria-pressed="false" data-v="2">S</button>
        <button aria-pressed="false" data-v="3">W</button>
      </div>
    </div>
    <div class="ctl"><label for="lvl">BIT PLANES</label>
      <input type="range" id="lvl" min="1" max="6" value="6" step="1">
      <span id="lvlv" style="color:var(--cyan);min-width:1ch">6</span>
    </div>
    <div class="ctl"><label for="zoom">ZOOM</label>
      <input type="range" id="zoom" min="2" max="9" value="4" step="1">
    </div>
    <div class="readout" role="status" aria-live="polite">blocks drawn <b id="nblk">&mdash;</b> &middot; columns <b id="ncol">&mdash;</b></div>
  </div>
</div>
<script src="city.js"></script>
<script>
Antescher.ready.then(function (CITY) {

/* ---------- isometric renderer ---------- */
const cvs = document.getElementById('iso');
const ctx = cvs.getContext('2d');
let view = 0, maxLevel = 6, tw = 4;

function height(b){
  b &= 0x3F; let h = 0;
  for (let k = 0; k < 6; k++) if (b & (1<<k)) h = k+1;
  return h;
}

/* the four walk orders — this is the entire rotation implementation */
const STEP = [
  (u,v) => [u, v],
  (u,v) => [v, 127-u],
  (u,v) => [127-u, 127-v],
  (u,v) => [127-v, u]
];

function render(){
  if (!CITY) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = cvs.clientWidth, H = cvs.clientHeight;
  cvs.width = W*dpr; cvs.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const TW = tw, TH = TW/2, TZ = TW*0.72;
  const originX = W/2, originY = H/2 - 128*TH/2 + 6*TZ/2;

  let blocks = 0, cols = 0;
  const step = STEP[view];

  ctx.lineWidth = 0;
  for (let u = 0; u < 128; u++){
    for (let v = 0; v < 128; v++){
      const [x,y] = step(u,v);
      const b = CITY[y*128 + x];
      if (!b) continue;
      const h = Math.min(height(b), maxLevel);
      if (h) cols++;
      const sx = originX + (u - v) * TW;
      const sy = originY + (u + v) * TH;
      if (sx < -40 || sx > W+40 || sy < -60 || sy > H+60) { blocks += h; continue; }
      for (let z = 0; z < h; z++){
        if (!(b & (1<<z))) continue;
        drawCube(sx, sy - z*TZ, TW, TH, TZ);
        blocks++;
      }
    }
  }
  document.getElementById('nblk').textContent = blocks.toLocaleString();
  document.getElementById('ncol').textContent = cols.toLocaleString();
}

function drawCube(sx, sy, TW, TH, TZ){
  /* left face */
  ctx.fillStyle = '#4A5160';
  ctx.beginPath();
  ctx.moveTo(sx-TW, sy); ctx.lineTo(sx, sy+TH);
  ctx.lineTo(sx, sy+TH+TZ); ctx.lineTo(sx-TW, sy+TZ);
  ctx.closePath(); ctx.fill();
  /* right face */
  ctx.fillStyle = '#7C8494';
  ctx.beginPath();
  ctx.moveTo(sx+TW, sy); ctx.lineTo(sx, sy+TH);
  ctx.lineTo(sx, sy+TH+TZ); ctx.lineTo(sx+TW, sy+TZ);
  ctx.closePath(); ctx.fill();
  /* top */
  ctx.fillStyle = '#C8CDD6';
  ctx.beginPath();
  ctx.moveTo(sx, sy-TH); ctx.lineTo(sx+TW, sy);
  ctx.lineTo(sx, sy+TH); ctx.lineTo(sx-TW, sy);
  ctx.closePath(); ctx.fill();
}

document.getElementById('views').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  view = +b.dataset.v;
  [...e.currentTarget.querySelectorAll('button')]
    .forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
document.getElementById('lvl').addEventListener('input', e => {
  maxLevel = +e.target.value;
  document.getElementById('lvlv').textContent = maxLevel;
  render();
});
document.getElementById('zoom').addEventListener('input', e => {
  tw = +e.target.value; render();
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });

/* the teardown ran 1180px wide; in an embed the frame decides the
   scale, so fit the city to it until the reader touches the slider */
var zoomEl = document.getElementById('zoom');
var userZoom = false;
zoomEl.addEventListener('input', function () { userZoom = true; });
function autofit() {
  if (userZoom) return;
  var W = cvs.clientWidth || 680;
  var t = Math.max(2, Math.min(9, Math.round(W / 254)));
  if (t !== tw) { tw = t; zoomEl.value = t; }
}
var at; window.addEventListener('resize', function () {
  clearTimeout(at); at = setTimeout(function () { autofit(); render(); }, 120);
});
autofit();
render();

}).catch(function () { document.getElementById('nblk').textContent = 'n/a'; });
</script>
<script src="frame.js"></script>
</body>
</html>
