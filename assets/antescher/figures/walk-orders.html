<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antescher — the four walk orders</title>
<link rel="stylesheet" href="embed.css">
</head>
<body>
<div class="walks">
  <div class="walk"><h4>View N</h4>
    <div class="grid"><span class="first">1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span class="last">9</span></div>
    <code>x&#8594; then y&#8595;</code></div>
  <div class="walk"><h4>View E</h4>
    <div class="grid"><span>3</span><span>6</span><span class="last">9</span><span>2</span><span>5</span><span>8</span><span class="first">1</span><span>4</span><span>7</span></div>
    <code>y&#8594; then x&#8593;</code></div>
  <div class="walk"><h4>View S</h4>
    <div class="grid"><span class="last">9</span><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span class="first">1</span></div>
    <code>x&#8592; then y&#8593;</code></div>
  <div class="walk"><h4>View W</h4>
    <div class="grid"><span>7</span><span>4</span><span class="first">1</span><span>8</span><span>5</span><span>2</span><span class="last">9</span><span>6</span><span>3</span></div>
    <code>y&#8592; then x&#8595;</code></div>
</div>
<script src="frame.js"></script>
</body>
</html>
