<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antescher — one byte per column</title>
<link rel="stylesheet" href="embed.css">
</head>
<body>
<div class="bytefig">
  <div class="bits">
    <div class="bit e"><div class="cell">E</div><div class="lbl">bit 7</div></div>
    <div class="bit"><div class="cell">&middot;</div><div class="lbl">bit 6</div></div>
    <div class="bit h"><div class="cell">5</div><div class="lbl">bit 5</div></div>
    <div class="bit h"><div class="cell">4</div><div class="lbl">bit 4</div></div>
    <div class="bit h"><div class="cell">3</div><div class="lbl">bit 3</div></div>
    <div class="bit h"><div class="cell">2</div><div class="lbl">bit 2</div></div>
    <div class="bit h"><div class="cell">1</div><div class="lbl">bit 1</div></div>
    <div class="bit h"><div class="cell">0</div><div class="lbl">bit 0</div></div>
  </div>
  <div class="bracket">E = ENTITY STANDING HERE (SET AT RUNTIME) &nbsp;&middot;&nbsp; BITS 0&ndash;5 = A BLOCK AT THAT HEIGHT</div>
</div>
<script src="frame.js"></script>
</body>
</html>
