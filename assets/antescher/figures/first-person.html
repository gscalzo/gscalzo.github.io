<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antescher — walk it</title>
<link rel="stylesheet" href="embed.css">
</head>
<body class="flush">
<div class="viewer">
  <div class="viewer-stage fp-stage">
    <canvas id="fp" aria-label="First-person view of the city of Antescher, rendered from the original map data"></canvas>
    <canvas id="mini" class="mini" aria-hidden="true" width="130" height="130"></canvas>
    <button id="fpStart" class="bigbtn">Enter the city</button>
  </div>
  <div class="viewer-bar">
    <div class="ctl"><span>MOVE</span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
    <div class="ctl"><span>TURN</span><kbd>&larr;</kbd><kbd>&rarr;</kbd><span class="muted">or drag</span></div>
    <div class="ctl"><label for="fov">FOV</label>
      <input type="range" id="fov" min="55" max="100" value="72" step="1">
      <span id="fovv" style="color:var(--cyan);min-width:3ch">72&deg;</span>
    </div>
    <div class="readout" role="status" aria-live="off">
      x <b id="fpx">&mdash;</b> &middot; y <b id="fpy">&mdash;</b> &middot; z <b id="fpz">&mdash;</b>
    </div>
  </div>
  <div class="touchpad" id="fpTouch" aria-hidden="true">
    <button data-k="a">&#9664;</button><button data-k="w">&#9650;</button>
    <button data-k="s">&#9660;</button><button data-k="d">&#9654;</button>
  </div>
</div>
<script src="city.js"></script>
<script>
Antescher.ready.then(function (CITY) {
  var solid = Antescher.solid, colHeight = Antescher.colHeight,
      settle = Antescher.settle, height = Antescher.height;

(function(){
  const stage = document.querySelector('.fp-stage');
  const cv = document.getElementById('fp'), g = cv.getContext('2d');
  const mini = document.getElementById('mini'), mg = mini.getContext('2d');
  const startBtn = document.getElementById('fpStart');
  if (!cv) return;

  const P = { x:0, y:0, z:0, a:0.7 };
  let fov = 72 * Math.PI/180, running = false, raf = 0;
  const keys = Object.create(null);

  function spawn(){
    /* stand in the largest open area we can find near the middle */
    for (let r=0; r<64; r++){
      for (let i=0; i<220; i++){
        const x = 64 + ((Math.random()*2-1)*r|0), y = 64 + ((Math.random()*2-1)*r|0);
        if (x<2||y<2||x>125||y>125) continue;
        if (colHeight(x,y)===0 && colHeight(x+1,y)===0 && colHeight(x,y+1)===0){
          P.x = x+0.5; P.y = y+0.5; P.z = 0; return;
        }
      }
    }
    P.x = 64.5; P.y = 64.5; P.z = 0;
  }

  /* movement with the game's own step-up / gravity rules */
  function tryMove(nx, ny){
    const cx = nx|0, cy = ny|0;
    const feet = P.z;
    if (!solid(cx, cy, feet)) {                       /* clear at feet height */
      P.x = nx; P.y = ny;
    } else if (!solid(cx, cy, feet+1) && feet+1 <= 5) { /* one-block rise: auto-jump */
      P.x = nx; P.y = ny; P.z = feet+1;
    }
    const s = settle(P.x|0, P.y|0, P.z);
    P.z = s.z;
  }

  function step(dt){
    const spd = 3.4*dt, rot = 2.0*dt;
    if (keys['arrowleft']||keys['q']) P.a -= rot;
    if (keys['arrowright']||keys['e']) P.a += rot;
    let fx=0, fy=0;
    if (keys['w']||keys['arrowup'])   { fx += Math.cos(P.a); fy += Math.sin(P.a); }
    if (keys['s']||keys['arrowdown']) { fx -= Math.cos(P.a); fy -= Math.sin(P.a); }
    if (keys['a']) { fx += Math.sin(P.a); fy -= Math.cos(P.a); }
    if (keys['d']) { fx -= Math.sin(P.a); fy += Math.cos(P.a); }
    const m = Math.hypot(fx,fy);
    if (m > 0){
      fx = fx/m*spd; fy = fy/m*spd;
      tryMove(P.x + fx, P.y);           /* slide along walls: axis at a time */
      tryMove(P.x, P.y + fy);
    }
  }

  function draw(){
    const dpr = Math.min(window.devicePixelRatio||1, 1.6);
    const W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== (W*dpr|0)) { cv.width = W*dpr|0; cv.height = H*dpr|0; }
    const w = cv.width, h = cv.height;
    const horizon = h*0.56;
    const proj = (h*0.5) / Math.tan(fov*0.5) * 1.32;
    const eye = P.z + 0.62;

    /* sky and desert floor */
    const sky = g.createLinearGradient(0,0,0,horizon);
    sky.addColorStop(0,'#070810'); sky.addColorStop(1,'#191E2B');
    g.fillStyle = sky; g.fillRect(0,0,w,horizon);
    const gr = g.createLinearGradient(0,horizon,0,h);
    gr.addColorStop(0,'#1B202B'); gr.addColorStop(1,'#2E3542');
    g.fillStyle = gr; g.fillRect(0,horizon,w,h-horizon);

    const COLS = Math.max(200, Math.min(420, Math.round(w/2.4)));
    const cw = w/COLS;
    const planeLen = Math.tan(fov*0.5);
    const MAXD = 46;

    for (let c=0; c<COLS; c++){
      const camX = 2*(c+0.5)/COLS - 1;
      const rdx = Math.cos(P.a) - Math.sin(P.a)*camX*planeLen;
      const rdy = Math.sin(P.a) + Math.cos(P.a)*camX*planeLen;

      let mx = P.x|0, my = P.y|0;
      const ddx = Math.abs(1/rdx), ddy = Math.abs(1/rdy);
      let sx, sy, sdx, sdy;
      if (rdx < 0){ sx=-1; sdx=(P.x-mx)*ddx; } else { sx=1; sdx=(mx+1-P.x)*ddx; }
      if (rdy < 0){ sy=-1; sdy=(P.y-my)*ddy; } else { sy=1; sdy=(my+1-P.y)*ddy; }

      /* collect hits near -> far, then paint far -> near (painter's) */
      const hits = [];
      let dist = 0, side = 0;
      for (let s=0; s<140 && dist < MAXD; s++){
        if (sdx < sdy){ sdx += ddx; mx += sx; side = 0; dist = sdx - ddx; }
        else          { sdy += ddy; my += sy; side = 1; dist = sdy - ddy; }
        if (mx<0||my<0||mx>127||my>127) break;
        const b = CITY[my*128+mx];
        if (b & 0x3F) hits.push(dist < 0.02 ? 0.02 : dist, b, side);
      }

      const px = Math.round(c*cw);
      const pw = Math.round((c+1)*cw) - px + 1;
      for (let i = hits.length-3; i >= 0; i -= 3){
        const d = hits[i], b = hits[i+1], sd = hits[i+2];
        const fog = Math.max(0, 1 - d/MAXD);
        for (let z=0; z<6; z++){
          if (!(b & (1<<z))) continue;
          const yTop = horizon + (eye - (z+1)) * proj / d;
          const yBot = horizon + (eye - z)     * proj / d;
          if (yBot < 0 || yTop > h) continue;
          /* concrete faces, shaded by orientation then by distance */
          const base = sd === 0 ? 186 : 82;
          const k = 0.16 + 0.84*fog*fog;          /* haze toward the sky colour */
          const r = (base*k + 25*(1-k))|0;
          const gg = (base*1.04*k + 30*(1-k))|0;
          const bb = (base*1.16*k + 43*(1-k))|0;
          g.fillStyle = 'rgb('+r+','+gg+','+bb+')';
          g.fillRect(px, Math.round(yTop), pw, Math.max(1, Math.round(yBot-yTop)));
          /* lit cap where a block's top edge is visible */
          if (!(b & (1<<(z+1))) && yTop > horizon-2){
            g.fillStyle = 'rgba(226,231,240,'+(0.42*fog*fog).toFixed(3)+')';
            g.fillRect(px, Math.round(yTop), pw, Math.max(1, Math.round(1.8*fog)));
          }
        }
      }
    }
    drawMini();
    document.getElementById('fpx').textContent = P.x|0;
    document.getElementById('fpy').textContent = P.y|0;
    document.getElementById('fpz').textContent = P.z;
  }

  function drawMini(){
    const S = 130, R = 26;
    mg.fillStyle = 'rgba(7,8,12,.85)'; mg.fillRect(0,0,S,S);
    const px = S/(R*2);
    for (let dy=-R; dy<R; dy++) for (let dx=-R; dx<R; dx++){
      const x = (P.x|0)+dx, y = (P.y|0)+dy;
      const hgt = colHeight(x,y);
      if (!hgt) continue;
      const t = 60 + hgt*26;
      mg.fillStyle = 'rgb('+t+','+(t+8)+','+(t+22)+')';
      mg.fillRect((dx+R)*px, (dy+R)*px, px+0.6, px+0.6);
    }
    mg.fillStyle = '#FF2E88';
    mg.beginPath(); mg.arc(S/2, S/2, 3.2, 0, 7); mg.fill();
    mg.strokeStyle = '#17D6E8'; mg.lineWidth = 1.6;
    mg.beginPath(); mg.moveTo(S/2, S/2);
    mg.lineTo(S/2 + Math.cos(P.a)*13, S/2 + Math.sin(P.a)*13); mg.stroke();
  }

  let last = 0;
  function loop(t){
    if (!running) return;
    const dt = Math.min(0.05, (t - last)/1000 || 0.016); last = t;
    step(dt); draw();
    raf = requestAnimationFrame(loop);
  }

  function start(){
    if (!CITY) return;
    spawn(); running = true; last = 0;
    stage.classList.add('running');
    startBtn.hidden = true;
    cv.setAttribute('tabindex','0'); cv.focus();
    raf = requestAnimationFrame(loop);
  }
  function stop(){ running = false; cancelAnimationFrame(raf); }

  startBtn.addEventListener('click', start);
  const kd = e => {
    if (!running) return;
    const k = e.key.toLowerCase();
    if (['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
      keys[k] = true; e.preventDefault();
    }
    if (k === 'escape') stop();
  };
  const ku = e => { keys[e.key.toLowerCase()] = false; };
  /* on window rather than the canvas: in an iframe, focus slips to the
     start button or the touch pad and the keys end up scrolling the host
     page. Both handlers no-op unless we are actually running. */
  window.addEventListener('keydown', kd); window.addEventListener('keyup', ku);
  window.addEventListener('blur', () => { for (const k in keys) keys[k]=false; });

  /* drag to look */
  let drag = null;
  const dstart = e => { if(!running) return; drag = (e.touches?e.touches[0]:e).clientX; };
  const dmove = e => {
    if (drag === null) return;
    const cx = (e.touches?e.touches[0]:e).clientX;
    P.a += (cx - drag) * 0.005; drag = cx;
    if (e.cancelable) e.preventDefault();
  };
  const dend = () => { drag = null; };
  cv.addEventListener('mousedown', dstart); window.addEventListener('mousemove', dmove);
  window.addEventListener('mouseup', dend);
  cv.addEventListener('touchstart', dstart, {passive:true});
  cv.addEventListener('touchmove', dmove, {passive:false});
  cv.addEventListener('touchend', dend);

  document.querySelectorAll('#fpTouch button').forEach(b => {
    const k = b.dataset.k;
    const on = e => { keys[k] = true; e.preventDefault(); };
    const off = () => { keys[k] = false; };
    b.addEventListener('touchstart', on, {passive:false});
    b.addEventListener('touchend', off);
    b.addEventListener('mousedown', on); b.addEventListener('mouseup', off);
    b.addEventListener('mouseleave', off);
  });

  document.getElementById('fov').addEventListener('input', e => {
    fov = (+e.target.value) * Math.PI/180;
    document.getElementById('fovv').textContent = e.target.value + '°';
    if (running) draw();
  });

  window.__fpReady = () => { if (CITY) { spawn(); draw(); } };
})();

  if (window.__fpReady) window.__fpReady();
});
</script>
<script src="frame.js"></script>
</body>
</html>
