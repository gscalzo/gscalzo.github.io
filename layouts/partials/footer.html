<footer
  class="mx-auto flex h-[4.5rem] max-w-(--w) items-center px-8 text-xs tracking-wider uppercase opacity-60"
>
  <div class="mr-auto">
    {{- if site.Copyright -}} {{- site.Copyright -}} {{- else -}} &copy; {{-
    now.Year }}
    <a class="link" href="{{- `` | absURL -}}">{{- site.Title -}}</a>
    {{- end -}}
  </div>

  <nav class="flex items-center justify-center space-x-6 dark:invert">
    {{- with site.Params.github -}}
      <a
        class="block h-5 w-5"
        href="https://github.com/{{ . }}"
        target="_blank"
        rel="me"
        aria-label="GitHub"
        title="GitHub"
      >
        <img
          src="{{- `github.svg` | relURL -}}"
          alt=""
          width="20"
          height="20"
          loading="lazy"
        />
      </a>
    {{- end -}}
    {{- with site.Params.linkedin -}}
      <a
        class="block h-5 w-5"
        href="https://linkedin.com/in/{{ . }}"
        target="_blank"
        rel="me"
        aria-label="LinkedIn"
        title="LinkedIn"
      >
        <img
          src="{{- `linkedin.svg` | relURL -}}"
          alt=""
          width="20"
          height="20"
          loading="lazy"
        />
      </a>
    {{- end -}}
    {{- $xHandle := site.Params.x | default site.Params.twitter -}}
    {{- with $xHandle -}}
      <a
        class="block h-5 w-5"
        href="https://x.com/{{ . }}"
        target="_blank"
        rel="me"
        aria-label="X"
        title="X"
      >
        <img
          src="{{- (cond (fileExists `static/x.svg`) `x.svg` `twitter.svg`) | relURL -}}"
          alt=""
          width="20"
          height="20"
          loading="lazy"
        />
      </a>
    {{- end -}}
  </nav>
</footer>
