<footer
  class="mx-auto flex h-[4.5rem] max-w-(--w) items-center px-8 text-xs tracking-wider uppercase opacity-60"
>
  <div class="mr-auto">
    {{- if site.Copyright -}} {{- site.Copyright -}} {{- else -}} &copy; {{-
    now.Year }}
    <a class="link" href="{{- `` | absURL -}}">{{- site.Title -}}</a>
    {{- end -}}
  </div>

  <nav class="flex justify-center space-x-6 items-center dark:invert">
    {{- if site.Params.github -}}
    <a
      class="h-5 w-5 block"
      style="background: url(/github.svg) center center / cover no-repeat;"
      href="https://github.com/{{- site.Params.github -}}"
      target="_blank"
      rel="me"
      aria-label="GitHub"
      title="GitHub"
    >
    </a>
    {{- end -}}
    {{- if site.Params.linkedin -}}
    <a
      class="h-5 w-5 block"
      style="background: url(/linkedin.svg) center center / cover no-repeat;"
      href="https://linkedin.com/in/{{- site.Params.linkedin -}}"
      target="_blank"
      rel="me"
      aria-label="LinkedIn"
      title="LinkedIn"
    >
    </a>
    {{- end -}}
    {{- if site.Params.twitter -}}
    <a
      class="h-5 w-5 block"
      style="background: url(/twitter.svg) center center / cover no-repeat;"
      href="https://twitter.com/{{- site.Params.twitter -}}"
      target="_blank"
      rel="me"
      aria-label="Twitter"
      title="Twitter"
    >
    </a>
    {{- end -}}
  </nav>
</footer>
