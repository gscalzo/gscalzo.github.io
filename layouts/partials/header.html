<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ `` | absURL }}" aria-label="Gio Scalzo, home">
      <span class="site-brand__mark" aria-hidden="true">GS</span>
      <span>Gio Scalzo</span>
    </a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
      <span>Menu</span>
      <span class="menu-toggle__lines" aria-hidden="true"></span>
    </button>

    <div class="site-navigation" id="site-navigation">
      {{- $current := .RelPermalink -}}
      {{- with site.Menus.main -}}
      <nav class="site-nav" aria-label="Primary navigation">
        {{- range . -}}
          {{- $active := or (eq $current .URL) (and (ne .URL "/") (hasPrefix $current .URL)) -}}
          <a href="{{ .URL }}"{{ if $active }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
        {{- end -}}
      </nav>
      {{- end -}}
      <a class="rss-link" href="{{ `/blog/index.xml` | absURL }}" aria-label="RSS feed">RSS</a>
      <button class="theme-toggle" type="button" aria-label="Switch colour theme">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
        </svg>
        <span>Theme</span>
      </button>
    </div>
  </div>
</header>

<script>
  (() => {
    const root = document.documentElement;
    const menuButton = document.querySelector('.menu-toggle');
    const themeButton = document.querySelector('.theme-toggle');
    const themeMeta = document.querySelector('meta[name="theme-color"]');

    const updateTheme = (dark) => {
      root.classList.toggle('dark', dark);
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      themeMeta?.setAttribute('content', dark ? '#171614' : '#f5f2ec');
    };

    menuButton?.addEventListener('click', () => {
      const open = root.classList.toggle('menu-open');
      menuButton.setAttribute('aria-expanded', String(open));
    });

    themeButton?.addEventListener('click', () => updateTheme(!root.classList.contains('dark')));
    setTimeout(() => root.classList.remove('not-ready'), 10);
  })();
</script>
