<!doctype html>
<html class="not-ready" lang="{{ site.Language.Locale | default site.Language.Lang }}" dir="{{ site.Params.direction | default `ltr` }}">
  {{- partial "head.html" . -}}
  <body class="site-body page-kind-{{ .Kind }} page-type-{{ .Type }}{{ with .File }} page-{{ .TranslationBaseName | urlize }}{{ end }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{- partial "header.html" . -}}

    <main id="main-content" class="site-main{{ if .IsHome }} site-main--home{{ end }}">
      <div class="content-shell">
        {{- block "main" . -}}{{- end -}}
      </div>
    </main>

    {{- partial "footer.html" . -}}
  </body>
</html>
