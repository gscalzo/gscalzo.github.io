<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ant Attack — the engine, running</title>
<link rel="stylesheet" href="embed.css">
</head>
<body class="flush">
<div class="viewer">
  <div class="viewer-stage game-stage">
    <canvas id="game" aria-label="Playable isometric demonstration of the Ant Attack engine"></canvas>
    <div class="hud" id="hud">
      <span>GRENADES <b id="hAmmo">6</b></span>
      <span>PARALYSED <b id="hAnts">0</b></span>
      <span>SCORE <b id="hScore">0</b></span>
    </div>
    <button id="gStart" class="bigbtn">Start</button>
    <div class="banner" id="gBanner" hidden></div>
  </div>
  <div class="viewer-bar">
    <div class="ctl"><span>MOVE</span><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd></div>
    <div class="ctl"><span>JUMP</span><kbd>Space</kbd></div>
    <div class="ctl"><span>THROW</span><kbd>G</kbd></div>
    <div class="ctl"><span>ROTATE</span><kbd>Q</kbd><kbd>E</kbd></div>
    <div class="readout" id="gStatus" role="status" aria-live="polite">Press Start</div>
  </div>
  <div class="touchpad game" id="gTouch" aria-hidden="true">
    <button data-g="left">&#9664;</button><button data-g="up">&#9650;</button>
    <button data-g="down">&#9660;</button><button data-g="right">&#9654;</button>
    <button data-g="jump">JUMP</button><button data-g="throw">THROW</button>
    <button data-g="rot">ROTATE</button>
  </div>
</div>
<script src="city.js"></script>
<script>
Antescher.ready.then(function (CITY) {
  var solid = Antescher.solid, colHeight = Antescher.colHeight,
      settle = Antescher.settle, isOpen = Antescher.isOpen, height = Antescher.height;

(function(){
  const cv = document.getElementById('game'); if (!cv) return;
  const g = cv.getContext('2d');
  const startBtn = document.getElementById('gStart');
  const banner = document.getElementById('gBanner');
  const statusEl = document.getElementById('gStatus');

  const TICK = 130;             /* player step interval  */
  const ANT_TICK = 250;         /* ant step interval     */
  const R = 27;                 /* cull radius, in cells */

  let view = 0, running = false, raf = 0, acc = 0, antAcc = 0, gAcc = 0;
  let last = 0, score = 0, paralysed = 0, ammo = 6, bites = 0, phase = 'seek';
  let gate = {x:2,y:64};
  const keys = Object.create(null);

  /* entity records — 8 of them, exactly like B480 */
  let player, hostage, ants, grenade;

  /* --- view transforms: the only place rotation exists --- */
  const FWD = [ (u,v)=>[u,v], (u,v)=>[v,127-u], (u,v)=>[127-u,127-v], (u,v)=>[127-v,u] ];
  const INV = [ (x,y)=>[x,y], (x,y)=>[127-y,x], (x,y)=>[127-x,127-y], (x,y)=>[y,127-x] ];

  function findGate(){
    let best = null;
    for (let i=0; i<128; i++){
      for (const [x,y] of [[i,1],[i,126],[1,i],[126,i]]){
        const h = colHeight(x,y);
        if (h <= 1 && isOpen(x, y===1?2:(y===126?125:y)) ){
          const d = Math.abs(x-64)+Math.abs(y-64);
          if (!best || d < best.d) best = {x,y,d};
        }
      }
    }
    return best || {x:2,y:64};
  }
  function randomOpen(minDistFrom, minD){
    for (let i=0; i<4000; i++){
      const x = 6 + (Math.random()*116|0), y = 6 + (Math.random()*116|0);
      if (!isOpen(x,y)) continue;
      if (minDistFrom && Math.abs(x-minDistFrom.x)+Math.abs(y-minDistFrom.y) < minD) continue;
      return {x,y};
    }
    return {x:64,y:64};
  }

  function reset(){
    gate = findGate();
    const s = settle(gate.x, gate.y, 5);
    player  = {x:gate.x, y:gate.y, z:s.z, face:0, fall:0, frame:0};
    const hp = randomOpen(gate, 55);
    hostage = {x:hp.x, y:hp.y, z:settle(hp.x,hp.y,5).z, face:2, found:false, frame:0};
    ants = [];
    for (let i=0; i<5; i++){
      const a = randomOpen(player, 22);
      ants.push({x:a.x, y:a.y, z:settle(a.x,a.y,5).z, face:0, sleep:0, frame:0, speed:1+(i%2)});
    }
    grenade = {active:false, x:0, y:0, z:0, dx:0, dy:0, life:0};
    score = 0; paralysed = 0; ammo = 6; bites = 0; phase = 'seek';
    setHud(); say('Find the other figure. Watch your back.');
  }

  const say = t => { statusEl.textContent = t; };
  function setHud(){
    document.getElementById('hAmmo').textContent = ammo;
    document.getElementById('hAnts').textContent = paralysed;
    document.getElementById('hScore').textContent = score;
  }

  /* --- move(), straight from section 05 --- */
  function move(e, dx, dy){
    const nx = e.x+dx, ny = e.y+dy;
    if (nx<0||ny<0||nx>127||ny>127) return false;
    if (solid(nx, ny, e.z)){
      if (!solid(nx, ny, e.z+1) && e.z+1 <= 5){ e.x=nx; e.y=ny; e.z=e.z+1; }  /* auto-jump */
      else return false;
    } else { e.x=nx; e.y=ny; }
    const s = settle(e.x, e.y, e.z);
    e.z = s.z; e.fall = s.fall;
    e.frame = (e.frame+1) & 3;
    return true;
  }
  const dirOf = (dx,dy) => dx>0?1 : dx<0?3 : dy>0?2 : 0;

  /* --- update_ant(), straight from section 06 --- */
  function updateAnt(a){
    if (a.sleep > 0){ if (a.sleep !== 255) a.sleep--; return; }
    const ddx = player.x - a.x, ddy = player.y - a.y;
    if (Math.abs(ddx) + Math.abs(ddy) > 34) {      /* out of range: roam */
      if (Math.random() < 0.5) move(a, Math.random()<0.5?1:-1, 0);
      else move(a, 0, Math.random()<0.5?1:-1);
      return;
    }
    const sx = Math.sign(ddx), sy = Math.sign(ddy);
    let moved;
    if (Math.abs(ddx) > Math.abs(ddy)) moved = move(a,sx,0) || move(a,0,sy);
    else                               moved = move(a,0,sy) || move(a,sx,0);
    if (moved) a.face = dirOf(sx,sy);
    if (Math.abs(ddx) <= 1 && Math.abs(ddy) <= 1 && Math.abs(player.z-a.z) <= 1) bite();
  }
  let biteCool = 0;
  function bite(){
    if (biteCool > 0) return;
    biteCool = 1200; bites++;
    say('Bitten. ' + (3-bites) + ' left.');
    if (bites >= 3) end(false, 'The ants got you', 'Three bites. Antescher keeps them both.');
  }

  function throwGrenade(){
    if (grenade.active || ammo <= 0) return;
    ammo--; setHud();
    const d = [[0,-1],[1,0],[0,1],[-1,0]][player.face];
    grenade = {active:true, x:player.x, y:player.y, z:player.z, dx:d[0], dy:d[1], life:7};
  }
  function stepGrenade(){
    if (!grenade.active) return;
    const nx = grenade.x+grenade.dx, ny = grenade.y+grenade.dy;
    if (grenade.life-- <= 0 || nx<0||ny<0||nx>127||ny>127 || solid(nx,ny,grenade.z)){
      explode(); return;
    }
    grenade.x = nx; grenade.y = ny;
    grenade.z = settle(nx,ny,grenade.z).z;
  }
  function explode(){
    grenade.active = false;
    let hit = 0;
    for (const a of ants){
      if (a.sleep === 255) continue;
      if (Math.abs(a.x-grenade.x) <= 2 && Math.abs(a.y-grenade.y) <= 2){
        a.sleep = 255; hit++; paralysed++; score += 250;   /* sleep = 255: never decrements */
      }
    }
    if (Math.abs(player.x-grenade.x) <= 1 && Math.abs(player.y-grenade.y) <= 1) bite();
    setHud();
    say(hit ? hit + ' paralysed.' : 'Missed.');
  }

  function checkGoals(){
    if (phase === 'seek' &&
        Math.abs(player.x-hostage.x) <= 1 && Math.abs(player.y-hostage.y) <= 1){
      hostage.found = true; phase = 'escape'; score += 1000; setHud();
      say('Found. Now get back to the gate.');
    }
    if (phase === 'escape'){
      /* hostage trails one step behind */
      const dx = Math.sign(player.x-hostage.x), dy = Math.sign(player.y-hostage.y);
      if (Math.abs(player.x-hostage.x)+Math.abs(player.y-hostage.y) > 1){
        if (Math.abs(dx) >= Math.abs(dy)) move(hostage,dx,0) || move(hostage,0,dy);
        else move(hostage,0,dy) || move(hostage,dx,0);
        hostage.face = dirOf(dx,dy);
      }
      if (Math.abs(player.x-gate.x) <= 1 && Math.abs(player.y-gate.y) <= 1){
        score += 2000 + ammo*100; setHud();
        end(true, 'Out of Antescher', 'Both of you. Score ' + score + '.');
      }
    }
  }

  /* ---------------- rendering ---------------- */
  function drawCube(sx, sy, TW, TH, TZ){
    g.fillStyle = '#4A5160';
    g.beginPath(); g.moveTo(sx-TW,sy); g.lineTo(sx,sy+TH);
    g.lineTo(sx,sy+TH+TZ); g.lineTo(sx-TW,sy+TZ); g.closePath(); g.fill();
    g.fillStyle = '#7C8494';
    g.beginPath(); g.moveTo(sx+TW,sy); g.lineTo(sx,sy+TH);
    g.lineTo(sx,sy+TH+TZ); g.lineTo(sx+TW,sy+TZ); g.closePath(); g.fill();
    g.fillStyle = '#C8CDD6';
    g.beginPath(); g.moveTo(sx,sy-TH); g.lineTo(sx+TW,sy);
    g.lineTo(sx,sy+TH); g.lineTo(sx-TW,sy); g.closePath(); g.fill();
  }
  /* original figures — a standing form and a low six-legged one */
  function drawHuman(sx, sy, TW, colour, frame){
    const s = TW/9, sw = (frame&1) ? 1 : -1;
    g.fillStyle = colour;
    g.beginPath(); g.ellipse(sx, sy-8.4*s, 2.3*s, 2.3*s, 0, 0, 7); g.fill();
    g.fillRect(sx-2.4*s, sy-6.4*s, 4.8*s, 5.2*s);
    g.fillRect(sx-4.2*s, sy-6.0*s, 1.7*s, 3.6*s);
    g.fillRect(sx+2.5*s, sy-6.0*s, 1.7*s, 3.6*s);
    g.fillRect(sx-2.2*s + sw*0.7*s, sy-1.2*s, 1.8*s, 3.4*s);
    g.fillRect(sx+0.5*s - sw*0.7*s, sy-1.2*s, 1.8*s, 3.4*s);
  }
  function drawAnt(sx, sy, TW, colour, frame, asleep){
    const s = TW/9, sw = (frame&1) ? 1 : -1;
    g.fillStyle = asleep ? '#6A7284' : colour;
    g.beginPath(); g.ellipse(sx+1.6*s, sy-2.6*s, 2.9*s, 2.0*s, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(sx-1.4*s, sy-3.0*s, 1.9*s, 1.5*s, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(sx-3.9*s, sy-3.4*s, 1.5*s, 1.3*s, 0, 0, 7); g.fill();
    g.strokeStyle = asleep ? '#6A7284' : colour; g.lineWidth = Math.max(1, 0.7*s);
    for (let i=-1; i<=1; i++){
      g.beginPath();
      g.moveTo(sx+i*2.1*s, sy-2.4*s);
      g.lineTo(sx+i*2.1*s + sw*1.5*s, sy-0.2*s); g.stroke();
      g.beginPath();
      g.moveTo(sx+i*2.1*s, sy-2.4*s);
      g.lineTo(sx+i*2.1*s - sw*1.5*s, sy-0.2*s); g.stroke();
    }
    if (asleep){
      g.strokeStyle = '#17D6E8'; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(sx-3.5*s, sy-6.5*s); g.lineTo(sx+3.5*s, sy-6.5*s); g.stroke();
    }
  }

  function render(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== (W*dpr|0)){ cv.width = W*dpr|0; cv.height = H*dpr|0; }
    g.setTransform(dpr,0,0,dpr,0,0);
    const grd = g.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#0F131C'); grd.addColorStop(1,'#0B0D12');
    g.fillStyle = grd; g.fillRect(0,0,W,H);

    const TW = Math.max(9, Math.min(15, W/54)), TH = TW/2, TZ = TW*0.72;
    const inv = INV[view], fwd = FWD[view];
    const [pu, pv] = inv(player.x, player.y);
    const ox = W/2, oy = H*0.60 + player.z*TZ;

    /* everything that could be standing in the window, keyed by cell */
    const occupants = new Map();
    const put = (e,kind) => {
      const [u,v] = inv(e.x, e.y);
      const k = u*128+v;
      if (!occupants.has(k)) occupants.set(k, []);
      occupants.get(k).push({e, kind});
    };
    put(player,'player'); put(hostage,'hostage');
    ants.forEach(a => put(a,'ant'));
    if (grenade.active) put(grenade,'grenade');

    /* the cull: a window around the player, walked in view order */
    for (let u = pu-R; u <= pu+R; u++){
      if (u < 0 || u > 127) continue;
      for (let v = pv-R; v <= pv+R; v++){
        if (v < 0 || v > 127) continue;
        const [x,y] = fwd(u,v);
        const b = CITY[y*128+x];
        const sx = ox + (u-pu)*TW - (v-pv)*TW;
        const sy = oy + (u-pu)*TH + (v-pv)*TH;
        if (sx < -TW*3 || sx > W+TW*3 || sy < -H*0.6 || sy > H+TZ*8) continue;

        if (b & 0x3F){
          const h = height(b);
          for (let z=0; z<h; z++) if (b & (1<<z)) drawCube(sx, sy - z*TZ, TW, TH, TZ);
        }
        /* gate marker, drawn flat so it reads as ground paint */
        if (x === gate.x && y === gate.y){
          g.strokeStyle = phase === 'escape' ? '#17D6E8' : '#8892A6';
          g.lineWidth = phase === 'escape' ? 3 : 2;
          g.setLineDash(phase === 'escape' ? [] : [4,3]);
          g.beginPath(); g.moveTo(sx,sy-TH); g.lineTo(sx+TW,sy);
          g.lineTo(sx,sy+TH); g.lineTo(sx-TW,sy); g.closePath(); g.stroke();
          g.setLineDash([]);
        }

        const here = occupants.get(u*128+v);
        if (here) for (const {e,kind} of here){
          const ey = sy - e.z*TZ;
          g.fillStyle = 'rgba(7,8,12,.32)';
          g.beginPath(); g.ellipse(sx, ey, TW*0.5, TW*0.25, 0, 0, 7); g.fill();
          if (kind === 'player')   drawHuman(sx, ey, TW, '#FF2E88', e.frame);
          else if (kind === 'hostage') drawHuman(sx, ey, TW, '#17D6E8', e.frame);
          else if (kind === 'ant') drawAnt(sx, ey, TW, '#E8E2C6', e.frame, e.sleep===255);
          else { g.fillStyle='#FFD166'; g.beginPath();
                 g.arc(sx, ey-TZ*0.4, TW*0.22, 0, 7); g.fill(); }
        }
      }
    }
  }

  /* ---------------- loop ---------------- */
  function tick(t){
    if (!running) return;
    const dt = Math.min(80, t - last || 16); last = t;
    acc += dt; antAcc += dt; gAcc += dt;
    if (biteCool > 0) biteCool -= dt;

    if (acc >= TICK){
      acc = 0;
      let dx=0, dy=0;
      if (keys['arrowup']||keys['w'])    dy = -1;
      else if (keys['arrowdown']||keys['s']) dy = 1;
      else if (keys['arrowleft']||keys['a']) dx = -1;
      else if (keys['arrowright']||keys['d']) dx = 1;
      if (dx || dy){
        /* screen-relative movement: the input is rotated, not the world */
        const [wx, wy] = FWD[view](dx===0?0:dx, dy===0?0:dy);
        const [ox2, oy2] = FWD[view](0,0);
        const mdx = wx-ox2, mdy = wy-oy2;
        if (move(player, mdx, mdy)) player.face = dirOf(mdx, mdy);
        if (player.fall > 3) say('That was a long way down.');
        checkGoals();
      }
    }
    if (antAcc >= ANT_TICK){ antAcc = 0; ants.forEach(updateAnt); checkGoals(); }
    if (gAcc >= 90){ gAcc = 0; stepGrenade(); }

    render();
    raf = requestAnimationFrame(tick);
  }

  function start(){
    if (!CITY) return;
    reset(); running = true; last = 0; banner.hidden = true;
    startBtn.hidden = true;
    cv.setAttribute('tabindex','0'); cv.focus();
    raf = requestAnimationFrame(tick);
  }
  function end(won, title, sub){
    running = false; cancelAnimationFrame(raf);
    banner.innerHTML = title + '<small>' + sub + '</small>';
    banner.hidden = false;
    startBtn.textContent = 'Again';
    startBtn.hidden = false;
    say(title + '. ' + sub);
  }

  startBtn.addEventListener('click', start);
  cv.addEventListener('keydown', e => {
    if (!running) return;
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'spacebar'){
      if (!solid(player.x,player.y,player.z+1) && player.z < 5) player.z++;
      e.preventDefault(); return;
    }
    if (k === 'g' || k === 'f'){ throwGrenade(); e.preventDefault(); return; }
    if (k === 'q'){ view = (view+3)%4; render(); e.preventDefault(); return; }
    if (k === 'e'){ view = (view+1)%4; render(); e.preventDefault(); return; }
    if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
      keys[k] = true; e.preventDefault();
    }
  });
  cv.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k]=false; });

  document.querySelectorAll('#gTouch button').forEach(b => {
    const act = b.dataset.g;
    const map = {up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'};
    const on = e => {
      e.preventDefault();
      if (map[act]) keys[map[act]] = true;
      else if (act === 'jump'){ if (!solid(player.x,player.y,player.z+1) && player.z<5) player.z++; }
      else if (act === 'throw') throwGrenade();
      else if (act === 'rot'){ view = (view+1)%4; render(); }
    };
    const off = () => { if (map[act]) keys[map[act]] = false; };
    b.addEventListener('touchstart', on, {passive:false});
    b.addEventListener('touchend', off);
    b.addEventListener('mousedown', on); b.addEventListener('mouseup', off);
    b.addEventListener('mouseleave', off);
  });

  window.__gameReady = () => { if (CITY){ reset(); render(); } };
})();

  if (window.__gameReady) window.__gameReady();
});
</script>
<script src="frame.js"></script>
</body>
</html>
