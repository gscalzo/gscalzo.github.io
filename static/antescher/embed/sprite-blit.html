<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ant Attack — AND mask, then OR data</title>
<link rel="stylesheet" href="embed.css">
</head>
<body>
<div class="blit">
  <div class="blitcell"><canvas id="bg" width="16" height="16"></canvas>
    <div class="op">1 &middot; background<br><b>the city already drawn</b></div></div>
  <div class="blitcell"><canvas id="mk" width="16" height="16"></canvas>
    <div class="op">2 &middot; AND mask<br><b>black = clear this pixel</b></div></div>
  <div class="blitcell"><canvas id="hl" width="16" height="16"></canvas>
    <div class="op">3 &middot; after AND<br><b>a hole, sprite-shaped</b></div></div>
  <div class="blitcell"><canvas id="fn" width="16" height="16"></canvas>
    <div class="op">4 &middot; OR data<br><b>figure sits in the hole</b></div></div>
</div>
<script>
(function(){
  const S = 16;
  /* a synthetic figure — not White's artwork, just the mechanic */
  const fig = [
    "0000001111000000","0000011111100000","0000011111100000","0000001111000000",
    "0000011111100000","0001111111111000","0011111111111100","0111011111101110",
    "0110011111100110","0000011111100000","0000011111100000","0000011111100000",
    "0000011001100000","0000011001100000","0000111001110000","0001110001111000"
  ];
  function bgpat(x,y){
    /* fake isometric brickwork so masking is visible */
    return ((x+y)%6<3) ? (((x*3+y*5)%7<4)?1:0) : (((x+y*2)%5<2)?1:0);
  }
  function paint(id, fn){
    const c = document.getElementById(id); if(!c) return;
    const g = c.getContext('2d');
    const img = g.createImageData(S,S);
    for(let y=0;y<S;y++) for(let x=0;x<S;x++){
      const [r,gr,b] = fn(x,y);
      const i = (y*S+x)*4;
      img.data[i]=r; img.data[i+1]=gr; img.data[i+2]=b; img.data[i+3]=255;
    }
    g.putImageData(img,0,0);
  }
  const on  = [124,132,148];
  const off = [11,13,18];
  const lit = [200,205,214];
  const mag = [255,46,136];

  paint('bg', (x,y) => bgpat(x,y) ? on : off);
  paint('mk', (x,y) => fig[y][x]==='1' ? off : lit);      /* mask: 0 where sprite is */
  paint('hl', (x,y) => fig[y][x]==='1' ? off : (bgpat(x,y)?on:off));
  paint('fn', (x,y) => fig[y][x]==='1' ? mag : (bgpat(x,y)?on:off));
})();
</script>
<script src="frame.js"></script>
</body>
</html>
